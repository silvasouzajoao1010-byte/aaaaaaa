# Base44 sandbox-only nginx config — mounted over /etc/nginx/nginx.conf.
#
# Why this file exists: the sandbox checks the repository out with a mode-700
# root directory, so nginx's default unprivileged `nginx` worker user cannot
# traverse the bind-mounted document root and every request returns 403. Running
# the workers as root lets them read it. Nothing here changes what the site
# serves; a normal deployment would use the image's stock configuration.
user  root;
worker_processes  auto;
error_log  /dev/stderr notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log  /dev/stdout;

    sendfile           on;
    keepalive_timeout  65;

    server {
        listen       80;
        listen  [::]:80;
        server_name  _;

        # The repository root, bind-mounted read-only.
        root   /usr/share/nginx/html;
        index  index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
